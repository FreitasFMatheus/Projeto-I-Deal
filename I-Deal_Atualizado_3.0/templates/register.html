{% extends 'base.html' %}

{% block title %}I-Deal - Cadastro{% endblock %}

{% block content %}
<div class="glass-container">
    <h2>Criar Conta</h2>
    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="name">Nome completo</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required
                minlength="6">
        </div>
        <button type="submit" class="btn btn-primary"
            style="width: 100%; margin-top: 1rem; padding: 14px; font-size: 1.1rem;">Cadastrar</button>
    </form>

    <div class="auth-footer">
        Já possui conta? <a href="{{ url_for('login') }}">Faça login</a>
    </div>
</div>
{% endblock %}
